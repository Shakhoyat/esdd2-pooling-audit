[pytest]
testpaths = tests
markers =
    gate: submission-readiness checks over the paper; run with `make gate`, not `make test`
# `make test` checks the code and the paper's numbers. The page-budget gate is a
# release condition, not a correctness test, and the paper currently fails it;
# folding it into the default run would make every test run red for a reason that
# has nothing to do with the code.
addopts = -m "not gate"
