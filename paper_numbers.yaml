# ---------------------------------------------------------------- Section 2
# The Abstract and §1 Introduction, as submitted, state every result in words with no digit;
# there is nothing to transcribe from them. §2.1 (the pooling model) and §2.2 (collapsibility,
# Theorem 1 / Lemma 1 / Proposition 1) likewise carry no printed digit: Proposition 1's
# counterexample proof, which is where the fractional breakpoints live, is commented out of
# the submitted source (visible in paper/main.tex, invisible in the compiled PDF), and the
# collapsibility residual bounds are stated as "negligible" / "non-negligible", not as digits.
# §2.2 also says "for both components of five systems" -- not tracked here as a digit claim,
# because collap.n_systems (s2_collapsibility()) is 7 (COLLAPSIBILITY_SYSTEMS: the four Table 1
# probes, sslam_linear and xlsr_linear, plus the baseline), a superset of the five systems the
# submitted paper actually reports. The claim is true of that superset and therefore of the five
# (negligible residual on 7 systems implies it on any 5 of them), but "five" itself is not a value
# collap.n_systems can be checked against without a second, five-only computation that does not
# currently exist.
- {id: s2_containment,    value: 0.0,    precision: 1, location: "§2.3 Theorem 2: containment checked in the released code", tier: 0, key: s2.sharpness.containment.worst_violation, compare: bound_below, printed: false,
   why: "stated in words ('the released code constructs an admissible system that matches both EERs within numerical precision'); checked as zero violations over random admissible systems"}
