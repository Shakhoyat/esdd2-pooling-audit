# Every numeric literal printed in the paper, with where it comes from.
#
# `value` is TRANSCRIBED BY HAND from main.tex at the precision the paper prints.
# It is deliberately NOT generated from our code: verify.py recomputes each one
# from per-clip scores and compares, so a generated file would make the check
# vacuous.
#
# tier 0            recomputable on CPU from per-clip scores; verify.py checks it
# tier 0-published  fixed by a published table, not recomputable without test labels
#
# `key` is a dotted path into the artefacts recompute.py returns.
# `printed: false`  a checked quantity the paper states in words or as a bound
#                   ("none", "fourteen", "to 10^-12") rather than as the digit.
# Entries are in reading order. A value printed in several places has one entry
# per place, so a change in one place cannot hide behind another.

meta:
  reference_step_bootstrap: {scheme: class-stratified clip, draws: 1000, seed: 1337}
  bootstrap_seed: 1337        # pinned; the intervals are reproducible only at this seed
  bootstrap_draws: 2000
  paper: "Metric Identifiability Under Structural-Zero Pooling in Audio Anti-Spoofing"
  transcribed_from: "paper/main.tex"
  # Tick labels on the figures' axes, plus a few structural digits the strip_structure() regexes
  # don't catch (subscript notation P_0/P_a losing its subscript in the text layer, the "Class 0"
  # category name, set notation {0,1}, and "ACDS(1,1)"). Not claims, but they are digits in the
  # text layer, so they are declared here rather than left to a loophole (an earlier prefix
  # rule hid them).
  figure_literals:
    - {token: "0", context: "structural: subscript P_0 losing its subscript in the text layer, and the 'Class 0' category name (repeated)"}
    - {token: "1", context: "structural: set notation {0,1} in Definition 1, and 'ACDS(1,1)' in Fig. 2's legend"}
    - {token: "2", context: "§4.4: the ranking is unchanged up to alpha_0 = 2 -- declared, not independently
       recomputed: no script here sweeps alpha_0 past the last crossing (0.125, tracked as
       s44a_cross) to confirm no further crossing occurs before 2"}
    - {token: "0.25", context: "Fig. 1 x-axis tick label"}
